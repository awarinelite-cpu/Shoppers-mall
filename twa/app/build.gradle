plugins { id 'com.android.application' }

// The website the app opens. One line in twa/host.txt (no https://, no slash).
def host = new File(rootDir, 'host.txt').text.trim()

android {
    namespace 'com.provisionpos.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.provisionpos.app'
        minSdk 23
        targetSdk 34
        versionCode (System.getenv('VERSION_CODE') ?: '1').toInteger()
        versionName '1.0'
        manifestPlaceholders = [hostName: host]
        resValue 'string', 'asset_statements',
            '[{\\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + host + '\\"}}]'
    }
    signingConfigs {
        release {
            storeFile file('../../signing/provision-pos.keystore')
            storePassword 'provisionpos'
            keyAlias 'provisionpos'
            keyPassword 'provisionpos'
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}

dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
