name: Build Android app (TWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['twa/**', 'signing/**', '.github/workflows/android-twa.yml']

permissions:
  contents: write        # to publish the APK as a GitHub release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.5' }
      - name: Build signed APK
        working-directory: twa
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle assembleRelease --no-daemon
      - name: Name the file
        run: cp twa/app/build/outputs/apk/release/app-release.apk Provision-POS.apk
      - uses: actions/upload-artifact@v4
        with: { name: Provision-POS-apk, path: Provision-POS.apk }
      - name: Publish as the latest release (easy download on the phone)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Provision-POS.apk --title "Provision POS (build ${{ github.run_number }})" \
            --notes "Android app (opens the live website). Download Provision-POS.apk and install it." --latest=false
